name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify structure
        run: |
          test -f src/linux-update
          test -f packaging/scripts/*.sh
          test -f release/*.sh
          test -f src/system/*.sh
          test -f version.txt

      - name: Check scripts
        run: |
          chmod +x src/linux-update
          bash -n src/linux-update
          bash -n src/system/*.sh
