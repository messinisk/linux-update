name: Build Packages

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Debug Git Tags
        run: |
          git tag
          git describe --tags --abbrev=0 || true
          
      - name: Install bats
        run: |
          sudo apt update
          sudo apt install -y bats

      - name: Run source tests
        run: |
          bats tests/apt.bats
          bats tests/dnf.bats
          bats tests/zypper.bats
          bats tests/osdetect.bats
          bats tests/install_tree.bats
          bats tests/version.bats
          bats tests/runtime_layout.bats

  package:

    runs-on: ubuntu-latest

    needs: test

    steps:

    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bats \
          createrepo-c \
          dpkg-dev

    - name: Build DEB
      run: bash packaging/scripts/build-deb.sh

    - name: Build RPM
      run: bash packaging/scripts/build-rpm.sh
    - name: Debug version
      run: |
        echo "===== VERSION ====="
        cat version.txt

        echo
        echo "===== DIST ====="
        find dist -type f | sort || true

        echo
        echo "===== RPM SOURCES ====="
        find build -type f | grep -E "tar.gz|spec" || true

    - name: Build AppImage
      run: bash packaging/scripts/appimage.sh

    - name: Run packaging tests
      run: |
        bats tests/ackage_layout.bats
        bats tests/appimage.bats
        bats tests/rpm_layout.bats
        bats tests/rpm_install.bats
        bats tests/repository.bats
        bats tests/repository_integration.bats
        bats tests/repository_signing.bats
        bats tests/signing.bats
    - name: Upload release artifacts
      uses: actions/upload-artifact@v5
      with:
        name: linux-update-${{ github.sha }}
        retention-days: 7
        path: |
          dist/**/*.deb
          dist/**/*.rpm
          dist/**/*.AppImage
          dist/**/SHA256SUMS
          dist/**/SHA256SUMS.asc
