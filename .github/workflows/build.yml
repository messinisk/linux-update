name: Build Packages

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt update
          sudo apt install -y bats

      - name: Run tests
        run: bats tests

  package:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - uses: actions/checkout@v4

      - name: Build DEB
        run: |
          bash packaging/scripts/build-deb.sh

      - name: Build RPM
        run: |
          bash packaging/scripts/build-rpm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/*