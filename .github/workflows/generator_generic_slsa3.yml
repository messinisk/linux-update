name: SLSA Provenance

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.artifacts.outputs.hashes }}

    steps:
      - uses: actions/checkout@v5

      - name: Build DEB
        run: bash packaging/scripts/build-deb.sh

      - name: Build RPM
        run: bash packaging/scripts/build-rpm.sh

      - name: Build AppImage
        run: bash packaging/scripts/appimage.sh

      - name: Generate artifact hashes
        id: artifacts
        run: |
          cd dist
          HASHES=$(sha256sum *.deb *.rpm *.AppImage | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@1.7.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"