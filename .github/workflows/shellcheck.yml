name: ShellCheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Έλεγχος του κεντρικού script
          shellcheck -x src/linux-update
          
          # Αυτόματη εύρεση και έλεγχος όλων των .sh αρχείων 
          # στους φακέλους packaging, src και release
          find packaging src release -type f -name "*.sh" -exec shellcheck -x {} +
